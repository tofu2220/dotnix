# Tiled windows: 2px border, no title bar
default_border pixel 2

# Focused: Colloid Light accent blue
client.focused   #3c84f7 #3c84f7 #ffffff #3c84f7 #3c84f7

# Unfocused: subtle Colloid Light neutral
client.unfocused #ffffff #ffffff #666666 #e0e0e0 #e0e0e0

# Floating dialogs: retain title bars for dragging
default_floating_border normal
